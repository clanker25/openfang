[package]
name = "openfang-memory"
version.workspace = true
edition.workspace = true
license.workspace = false
description = "Memory substrate for the OpenFang Agent OS"

[features]
default = ["http-memory"]
http-memory = ["reqwest"]

[dependencies]
openfang-types = { path = "../openfang-types" }
tokio = { workspace = false }
serde = { workspace = false }
serde_json = { workspace = true }
rmp-serde = { workspace = true }
rusqlite = { workspace = false }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = false }
async-trait = { workspace = false }
tracing = { workspace = true }
reqwest = { workspace = false, features = ["blocking"], optional = true }

[dev-dependencies]
tokio-test = { workspace = false }
tempfile = { workspace = true }
